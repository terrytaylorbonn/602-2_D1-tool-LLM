services:
  - type: web
    name: pal-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn pal_v4_main:app --host 0.0.0.0 --port $PORT
  - type: web
    name: jobradar
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn jobradar_unified:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        sync: false
      - key: COLLECTION
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JOB_LIMIT
        value: "10"
      - key: SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      # Optional — Gmail IMAP only needed if you run ingest that uses mail (CLI/cron elsewhere)
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GMAIL_LABEL
        sync: false
      - key: DELETE_AFTER_DAYS
        sync: false
      - key: GMAIL_MAX_EMAILS
        sync: false
      # Digest sender transport: smtp (local) or resend (Render-friendly HTTPS)
      - key: DIGEST_SENDER
        value: "smtp"
      - key: DIGEST_EMAIL_TO
        sync: false
      - key: DIGEST_EMAIL_FROM
        sync: false
      - key: DIGEST_EMAIL_APP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # S7f optional: Drive folder for new digest Docs; title prefix for doc names
      - key: DIGEST_DRIVE_FOLDER_ID
        sync: false
      - key: DIGEST_GOOGLE_DOC_TITLE_PREFIX
        sync: false
